name: ANCSWatchConfig
options:
  minimumXcodeGenVersion: 2.38.0
packages: {}
targets:
  ANCSWatchConfig:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ANCSWatchConfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ancswatchconfig
        INFOPLIST_FILE: ANCSWatchConfig/App/Info.plist
        SWIFT_VERSION: 5.10
        DEVELOPMENT_TEAM: ""
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        CODE_SIGN_STYLE: Automatic
